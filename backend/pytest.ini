[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = strict

markers =
    heavy: loads a large model onto the GPU (SDXL / Qwen-VL). Slow, and the 6GB
        GPU cannot reliably host these back-to-back with the other model tests
        in one process — run them on their own:
            pytest -m heavy
        The fast suite is:
            pytest -m "not heavy"
