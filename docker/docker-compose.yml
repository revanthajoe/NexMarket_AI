version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexmarket_postgres
    environment:
      POSTGRES_USER: nexmarket
      POSTGRES_PASSWORD: nexmarket
      POSTGRES_DB: nexmarket_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexmarket"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nexmarket_backend
    env_file: ../backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - poster_assets:/app/assets/posters
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://nexmarket:nexmarket@postgres:5432/nexmarket_db
      - SYNC_DATABASE_URL=postgresql://nexmarket:nexmarket@postgres:5432/nexmarket_db
      - AI_TEXT_PROVIDER=${AI_TEXT_PROVIDER:-gemini}
      # Instagram/Facebook/WhatsApp fetch posted media server-side, so this
      # must be a publicly reachable URL (e.g. a domain in front of this
      # container, or an ngrok tunnel during testing) — a Docker-internal
      # service name like http://backend:8000 is NOT reachable from Meta's
      # servers and will not work. Leave unset to fall back to
      # STATIC_BASE_URL for local/mock-only use. Telegram is exempt (direct
      # byte upload) and unaffected either way.
      - PUBLIC_MEDIA_BASE_URL=${PUBLIC_MEDIA_BASE_URL:-}

  # ── n8n ───────────────────────────────────────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: nexmarket_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=nexmarket123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/home/node/.n8n/workflows:ro
    depends_on:
      - backend

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: nexmarket_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  poster_assets:
  n8n_data:
